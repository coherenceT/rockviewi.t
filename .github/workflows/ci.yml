name: CI

on:
  pull_request:
  push:
    branches: [main]

# Required for the branch protection rule on main: select the "verify" check.
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Type checking covers the browser pages, the Pages Functions and the tests.
      - run: npm run typecheck

      # Unit and integration tests. No credentials and no network: the
      # submission flow runs against an in-memory implementation of the
      # storage port. The RLS proofs are skipped here because they need a
      # Supabase project - run them locally with `npx vitest run tests/rls`.
      - run: npm test

      # A build failure would otherwise only surface in the Cloudflare Pages log.
      - run: npm run build

      # Browser smoke tests against the built site, served by wrangler in the
      # same workerd runtime production uses.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
