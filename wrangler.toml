# Freebuff Sites static asset Worker configuration. Pages-specific KV settings
# are intentionally omitted; Freebuff Sites does not provide KV namespaces.
name = "it-career-foundation"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# NOTE: ENVIRONMENT is deliberately NOT here. It differs per environment
# (preview vs production) and must be set per-environment in the dashboard;
# `wrangler pages deploy` pushes [vars] over it, which would force
# ENVIRONMENT=development onto Production and make the Worker treat
# production as development - silently disabling the fail-closed Turnstile
# check. EMAIL_PROVIDER is the same for both environments, so it stays.
EMAIL_PROVIDER = "knock"
# Knock workflow that renders and sends the confirmation email. Not a secret
# (the secret key is KNOCK_SECRET_KEY, dashboard-only). It MUST be listed here:
# `wrangler pages deploy` replaces this environment's plain vars with exactly
# the keys below, so a value set only in the dashboard is dropped on deploy.
KNOCK_WORKFLOW_KEY = "application-received"
